# FINAL RUN (evidence for H1): all 462 sample examples, conditions C1/C2/C3, pinned versions.
# PT-BR: public human-reviewed translation c2d-usp/banking77-pt-br (Dimant et al., 2025),
# aligned to our sample by scripts/build_usp_data.py (data/usp/). Never resumes over records
# made from other inputs.
seed: 42
sample_size: 462
ece_bins: 15
conditions: [C1, C2, C3]
systems: [jev, llm]
jev:
  model: jev-1.14.0  # pinned version instead of the moving alias jev-latest
llm:
  # Built from configs/ollama/ministral-3-14b-ctx8k.Modelfile (FROM ministral-3:14b, num_ctx 8192).
  model: ministral-3-14b-ctx8k
  num_ctx: 8192  # must match the Modelfile; requests using >= 90% of it are recorded as ContextOverflow
  base_url: http://localhost:11434/v1
  api_key: ollama  # Ollama ignores the key; the OpenAI client just needs a non-empty value
datasets:
  - name: banking77
    task: choice
    source: {hf_id: PolyAI/banking77, split: test, revision: 1846984189f2bc0ac51c6fc3a600fa9e1714e0c6}
    paths:
      sample: data/usp/sample_usp.jsonl
      intents: data/usp/intents_usp.json
paths:
  raw_predictions: outputs/final/raw_predictions.jsonl
