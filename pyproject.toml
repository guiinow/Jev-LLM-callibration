[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-llm-banking77-calibration"
version = "0.1.0"
description = "Controlled calibration evaluation of Jev and a generative LLM on Banking77."
requires-python = ">=3.12"
dependencies = [
  "datasets==5.1.0",
  "httpx==0.28.1",
  "matplotlib==3.11.2",
  "numpy==2.5.4",
  "openai==3.46.0",
  "pandas==3.1.1",
  "pyyaml==6.0.3",
  "typesafe-sdk==0.7.5",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
jev-eval = "jev_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
